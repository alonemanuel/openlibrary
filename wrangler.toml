name = "openlibrary"
main = "server/dist/worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Per-user data (users, items, item_events, friendships) and the shared
# metadata cache both live here — see migrations for the split.
[[d1_databases]]
binding = "DB"
database_name = "openlibrary"
database_id = "499365fa-69e6-4bd1-b063-92a660b52246"

# Mirrored cover art and artist photos. Immutable, content-addressed,
# served with a one-year cache header.
[[r2_buckets]]
binding = "ART"
bucket_name = "music-art"

[observability]
enabled = true
