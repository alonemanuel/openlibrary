name: Deploy

# Every push to main ships the Worker. Pull requests only run the checks, so a
# branch can never deploy over production by accident.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

env:
  # Pinned deliberately. An older wrangler does not understand
  # assets.run_worker_first and silently serves static files ahead of the
  # Worker — which publishes the entire library to anyone who loads the page.
  WRANGLER_VERSION: '4.125.0'
  APP_URL: https://music-library.alonemanuel95.workers.dev

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The shell must carry no library data
        run: |
          shell=worker/public/index.html
          test -f "$shell"
          grep -q '/\*__DATA__\*/null' "$shell" \
            || { echo "::error::shell lost its data placeholder"; exit 1; }
          if grep -q '"songs":\[\[' "$shell"; then
            echo "::error::a library is baked into the shell"; exit 1
          fi

      - name: The worker must run before static assets
        run: |
          grep -q '^run_worker_first = true' worker/wrangler.toml \
            || { echo "::error::run_worker_first is not set — assets would bypass auth"; exit 1; }

      # A pull request uploads a version and gets its own URL, but takes no
      # production traffic until the branch merges.
      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: versions upload

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const out = `${{ steps.preview.outputs.command-output }}`;
            const url = (out.match(/https:\/\/[a-z0-9-]+\.workers\.dev/) || [])[0];
            if (!url) return;
            const body = [
              `**Preview:** ${url}`,
              '',
              'Sign-in gated, same as production. Note it reads the **live D1 and R2**,',
              'so data changes here are not isolated from prod.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.body.startsWith('**Preview:**'));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Deploy Worker
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: ${{ env.WRANGLER_VERSION }}

      # Deploying is not the same as being safe. Prove the live site refuses to
      # serve a library to someone who is not signed in.
      - name: Signed-out smoke test
        if: github.event_name == 'push'
        run: |
          sleep 8
          code=$(curl -s -o /tmp/body.html -w '%{http_code}' "$APP_URL/")
          echo "GET / -> $code"
          [ "$code" = "401" ] || { echo "::error::expected 401 for a signed-out visitor, got $code"; exit 1; }
          if grep -qE '"songs":\[\[|const DATA = \{' /tmp/body.html; then
            echo "::error::library data served to a signed-out visitor"; exit 1
          fi
          api=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/library")
          [ "$api" = "401" ] || { echo "::error::/api/library returned $api unauthenticated"; exit 1; }
          echo "signed-out access is sealed"
