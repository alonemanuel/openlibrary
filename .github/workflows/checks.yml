name: Checks

# Typecheck and tests for the whole workspace. deploy.yml guards the music
# Worker's shipping path; this guards the code itself.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (server, web, music worker)
        run: npm run typecheck

      - name: Server tests
        run: npm test
